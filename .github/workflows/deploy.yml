# main に push すると、テストを通してから GitHub Pages に公開する
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 手動でも動かせる

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1本ずつ。古い実行は 止める
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1 # 手元と そろえる
          cache: true

      - run: flutter pub get

      # info は 30件ほど もとからあるので 止めない。
      # warning と error だけ 失敗にする
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # GitHub Pages は /rune_link/ の下に置かれるので base-href が要る。
      # pwa-strategy=none は 古い版が キャッシュされ続けるのを防ぐため
      - run: flutter build web --release --pwa-strategy=none --base-href /rune_link/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
